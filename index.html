<head>

  <title>Tutos Informatique appliquée</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #eff6ff;
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dbe3ef;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--background);
      line-height: 1.5;
    }
    a {
      color: var(--primary);
    }
    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }
    header {
      padding: 56px 0 42px;
      color: #ffffff;
      background: linear-gradient(135deg, #1d4ed8, #2563eb 55%, #60a5fa);
    }
    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.1;
    }
    header p {
      max-width: 720px;
      margin: 0;
      font-size: 1.1rem;
      opacity: 0.95;
    }
    .controls {
      display: grid;
      gap: 18px;
      margin: 30px 0;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .search-label {
      font-weight: 700;
    }
    #search {
      width: 100%;
      margin-top: 8px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      color: var(--text);
      background: #ffffff;
    }
    #search:focus {
      outline: 3px solid rgba(37, 99, 235, 0.2);
      border-color: var(--primary);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .filter-button {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      background: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .filter-button:hover,
    .filter-button:focus {
      border-color: var(--primary);
      color: var(--primary-dark);
    }
    .filter-button.active {
      border-color: var(--primary);
      color: #ffffff;
      background: var(--primary);
    }
    .summary {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }
    .tutorial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding-bottom: 48px;
    }
    .tutorial-card {
      display: flex;
      flex-direction: column;
      min-height: 300px;
      padding: 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }
    .software {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--primary-dark);
      background: var(--secondary);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .level {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }
    .tutorial-card h2 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      line-height: 1.25;
    }
    .tutorial-card p {
      margin: 0 0 16px;
      color: var(--muted);
    }
    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }
    .keyword {
      padding: 4px 8px;
      border-radius: 6px;
      color: #475569;
      background: #f1f5f9;
      font-size: 0.78rem;
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .metadata {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .tutorial-link {
      display: inline-block;
      padding: 9px 12px;
      border-radius: 8px;
      color: #ffffff;
      background: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    .tutorial-link:hover,
    .tutorial-link:focus {
      background: var(--primary-dark);
    }
    .empty {
      grid-column: 1 / -1;
      padding: 40px 20px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      background: var(--surface);
    }
    footer {
      padding: 24px 0 36px;
      color: var(--muted);
      text-align: center;
      font-size: 0.9rem;
    }
    @media (max-width: 600px) {
      .container {
        width: min(100% - 22px, 1180px);
      }
      header {
        padding: 40px 0 32px;
      }
      .controls {
        padding: 16px;
      }
      .card-footer {
        align-items: flex-start;
        flex-direction: column;
      }
      .tutorial-link {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

        description: "Créez un questionnaire ou un sondage interactif avec Microsoft Forms.",
        level: "Intermédiaire",
        date: "2026-08-30"
      }
    ];
    var grid = document.getElementById("tutorial-grid");
    var searchInput = document.getElementById("search");
    var summary = document.getElementById("summary");
    var filterButtons = document.querySelectorAll(".filter-button");
    var activeFilter = "all";
    function normalize(value) {
      return value.toLocaleLowerCase("fr").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }
    function formatDate(dateString) {
      var date = new Date(dateString + "T00:00:00");
      if (isNaN(date.getTime())) {
        return dateString;
      }
      return new Intl.DateTimeFormat("fr-FR", {day: "2-digit", month: "2-digit", year: "numeric"}).format(date);
    }
    function matchesSearch(tutorial, searchTerm) {
      var searchableContent = [tutorial.title, tutorial.software, tutorial.description, tutorial.level, tutorial.keywords.join(" ")].join(" ");
      return normalize(searchableContent).indexOf(normalize(searchTerm)) !== -1;
    }
    function matchesFilter(tutorial) {
      if (activeFilter === "all") {
        return true;
      }
      return tutorial.software === activeFilter || tutorial.level === activeFilter;
    }
    function createCard(tutorial) {
      var card = document.createElement("article");
      card.className = "tutorial-card";
      var top = document.createElement("div");
      top.className = "card-top";
      var software = document.createElement("span");
      software.className = "software";
      software.textContent = tutorial.software;
      var level = document.createElement("span");
      level.className = "level";
      level.textContent = tutorial.level;
      top.appendChild(software);
      top.appendChild(level);
      var title = document.createElement("h2");
      title.textContent = tutorial.title;
      var description = document.createElement("p");
      description.textContent = tutorial.description;
      var keywords = document.createElement("div");
      keywords.className = "keywords";
      for (var i = 0; i < tutorial.keywords.length; i++) {
        var keyword = document.createElement("span");
        keyword.className = "keyword";
        keyword.textContent = tutorial.keywords[i];
        keywords.appendChild(keyword);
      }
      var footer = document.createElement("div");
      footer.className = "card-footer";
      var metadata = document.createElement("span");
      metadata.className = "metadata";
      metadata.textContent = tutorial.duration + " · Mis à jour le " + formatDate(tutorial.date);
      var link = document.createElement("a");
      link.className = "tutorial-link";
      link.href = tutorial.link;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Voir le tutoriel";
      footer.appendChild(metadata);
      footer.appendChild(link);
      card.appendChild(top);
      card.appendChild(title);
      card.appendChild(description);
      card.appendChild(keywords);
      card.appendChild(footer);
      return card;
    }
    function renderTutorials() {
      var searchTerm = searchInput.value.trim();
      var filteredTutorials = [];
      for (var i = 0; i < tutorials.length; i++) {
        if (matchesFilter(tutorials[i]) && matchesSearch(tutorials[i], searchTerm)) {
          filteredTutorials.push(tutorials[i]);
        }
      }
      grid.innerHTML = "";
      if (filteredTutorials.length === 0) {
        var emptyMessage = document.createElement("div");
        emptyMessage.className = "empty";
        emptyMessage.textContent = "Aucun tutoriel ne correspond à votre recherche.";
        grid.appendChild(emptyMessage);
      } else {
        for (var i = 0; i < filteredTutorials.length; i++) {
          grid.appendChild(createCard(filteredTutorials[i]));
        }
      }
      var count = filteredTutorials.length;
      summary.textContent = count + " tutoriel" + (count > 1 ? "s" : "") + " affiché" + (count > 1 ? "s" : "") + " sur " + tutorials.length + ".";
    }
    for (var i = 0; i < filterButtons.length; i++) {
      filterButtons[i].addEventListener("click", function() {
        for (var j = 0; j < filterButtons.length; j++) {
          filterButtons[j].classList.remove("active");
        }
        this.classList.add("active");
        activeFilter = this.getAttribute("data-filter");
        renderTutorials();
      });
    }
    searchInput.addEventListener("input", renderTutorials);
    renderTutorials();
  </script>
</body>
</html>
